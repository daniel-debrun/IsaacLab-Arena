shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 20
  rollout_limit:
    num_episodes: 20
  variations:
    light:
      hdr_image:
        enabled: true
        hdr_names:
        - home_office_robolab
    droid_abs_joint_pos:
      camera_extrinsics_wrist_camera:
        enabled: false
        sampler_cfg:
          low:
          - -0.05
          - -0.05
          - -0.05
          high:
          - 0.05
          - 0.05
          - 0.05
runs:
  banana_then_rubiks_cube_pi0:
    environment:
      type: isaaclab_arena_environments/robolab_corrected_exact/tasks/banana_then_rubiks_cube.yaml
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
