shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 5
    seed: 42
  policy:
    type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
    policy_variant: pi05
    remote_host: 127.0.0.1
    remote_port: 8001
    openpi_embodiment_adapter: droid
    policy_device: cuda:0
  rollout_limit:
    num_episodes: 10
runs:
  kitchen_bench_lightwheel_pick_orange_shelf_on_plate_u_shaped_with_island_farmhouse2:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_pick_orange_shelf_on_plate_u_shaped_with_island_farmhouse2.yaml
  kitchen_bench_replicator_g_shape_banana_in_left_bowl:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_replicator_g_shape_banana_in_left_bowl.yaml
  kitchen_bench_replicator_g_shape_mustard_on_wooden_block:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_replicator_g_shape_mustard_on_wooden_block.yaml
  kitchen_bench_replicator_g_shape_turn_stand_mixer_knob:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_replicator_g_shape_turn_stand_mixer_knob.yaml
  kitchen_bench_round2_coastal_stack_soup_on_cracker_box:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_round2_coastal_stack_soup_on_cracker_box.yaml
  kitchen_bench_round2_farmhouse_apple_down_to_bowl:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_round2_farmhouse_apple_down_to_bowl.yaml
  kitchen_bench_round2_peninsula_soup_in_far_bowl:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_round2_peninsula_soup_in_far_bowl.yaml
  kitchen_bench_round2_scandinavian_open_right_microwave:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_round2_scandinavian_open_right_microwave.yaml
  kitchen_bench_round2_scandinavian_three_fruits_in_bowl:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_round2_scandinavian_three_fruits_in_bowl.yaml
  kitchen_bench_replicator_g_shape_banana_and_orange_in_bowl:
    environment:
