name: Design proposal
description: Propose a feature, public API, or significant design change.
title: "[Design]: "
labels:
  - design
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement to IsaacLab-Arena.

        Use this form for new features, public API changes, or significant design changes.
        Please read `docs/community-contributions.md` before submitting.

        For smaller proposals, Proof of Concept and Alternatives Considered are optional.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        What problem does this solve? Who is affected, and why is the current behavior or API insufficient?
      placeholder: |
        Users cannot currently...
        This matters because...
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: Goals and non-goals
      description: |
        List the outcomes this proposal should achieve, followed by work that is explicitly out of scope.
      placeholder: |
        Goals:
        - ...

        Non-goals:
        - ...
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: |
        Describe the high-level approach, main components, data flow, and expected behavior.
      placeholder: |
        The proposal adds...
        The main components are...
        Users will...
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: High-level API
      description: |
        Show concise example usage or pseudocode for new or changed public APIs.
      placeholder: |
        ```python
        # Example intended usage
        ```
    validations:
      required: true

  - type: textarea
    id: gaps
    attributes:
      label: Gaps and open questions
      description: |
        List known limitations, dependencies, compatibility concerns, risks, or unresolved design decisions.
      placeholder: |
        - Compatibility:
        - Dependencies:
        - Open questions:
    validations:
      required: true

  - type: textarea
    id: poc
    attributes:
      label: Proof of concept (optional)
      description: |
        Link a draft PR/MR, branch, experiment, benchmark, or minimal implementation if available.
      placeholder: |
        Draft PR/MR:
        Branch:
        Validation results:
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: |
        Describe other approaches considered and why this proposal is preferred.
      placeholder: |
        Alternative:
        Why it was not selected:
    validations:
      required: false

  - type: textarea
    id: readiness
    attributes:
      label: Implementation readiness
      description: |
        If a PR/MR is available, link it and state its readiness.

        Contributors are responsible for the correctness of all submitted code, including AI-assisted or agent-generated code. A ready-to-merge change must be focused, tested, documented, consistent with project conventions, and pass required formatting, linting, type checks, tests, benchmarks, and CI.
      placeholder: |
        PR/MR:
        Completed checks:
        - [ ] Formatting
        - [ ] Linting
        - [ ] Type checks
        - [ ] Unit/integration tests
        - [ ] Benchmarks, if applicable
        - [ ] Documentation updates
        - [ ] CI
    validations:
      required: true
